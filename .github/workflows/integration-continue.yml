name: Intégration continue

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: integration-continue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend .NET
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ReferenceDessin/Back/ReferenceDessin

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer le SDK .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurer les dépendances
        run: dotnet restore ReferenceDessin.sln

      - name: Compiler le backend
        run: >
          dotnet build ReferenceDessin.sln
          --configuration Release
          --no-restore

      - name: Exécuter les tests backend
        run: >
          dotnet test ReferenceDessin.sln
          --configuration Release
          --no-build

  frontend:
    name: Frontend Angular
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ReferenceDessin/Front/reference-dessin-web

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ReferenceDessin/Front/reference-dessin-web/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter les tests frontend
        run: npm test -- --watch=false

      - name: Compiler le frontend
        run: npm run build
