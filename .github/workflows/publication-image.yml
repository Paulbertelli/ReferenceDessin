name: Publication de l'image Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publier:
    name: Publier l'image multiplateforme
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Définir le nom de l'image
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reference-dessin" >> "$GITHUB_ENV"

      - name: Préparer l'émulation ARM64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Se connecter au registre GitHub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v7
        with:
          context: ./ReferenceDessin
          file: ./ReferenceDessin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max