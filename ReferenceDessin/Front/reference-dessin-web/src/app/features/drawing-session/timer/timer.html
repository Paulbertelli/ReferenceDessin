<div class="timer">
  <div class="progress" [style.width.%]="progress()" aria-hidden="true"></div>

  <button
    type="button"
    class="icon-button primary-action"
    (click)="toggleRequested.emit()"
    [disabled]="disabled()"
    [attr.aria-label]="running() ? 'Mettre le minuteur en pause' : 'Démarrer le minuteur'"
    [title]="running() ? 'Mettre en pause' : 'Démarrer'"
  >
    @if (running()) {
      <svg lucidePause [size]="19" aria-hidden="true"></svg>
    } @else {
      <svg lucidePlay [size]="19" aria-hidden="true"></svg>
    }
  </button>

  <output class="time" aria-label="Temps restant">
    {{ formattedTime() }}
  </output>

  <label class="duration">
    <span>Durée</span>

    <span class="duration-input">
      <input
        type="number"
        min="0.1"
        max="60"
        step="0.5"
        [ngModel]="durationMinutes()"
        (ngModelChange)="updateDuration($event)"
        (change)="resetRequested.emit()"
        aria-label="Durée en minutes"
      />

      <span>min</span>
    </span>
  </label>

  <button
    type="button"
    class="icon-button reset-button"
    (click)="resetRequested.emit()"
    aria-label="Réinitialiser le minuteur"
    title="Réinitialiser"
  >
    <svg lucideRotateCcw [size]="18" aria-hidden="true"></svg>
  </button>
</div>
