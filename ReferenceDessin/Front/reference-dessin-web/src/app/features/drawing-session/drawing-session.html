<main class="workspace" [attr.aria-busy]="imageLoading()" aria-live="polite">
  @if (displayedImage(); as image) {
    <figure class="reference">
      <div class="image-container">
        <button
          type="button"
          class="image-button"
          (click)="openImageOverlay()"
          aria-label="Agrandir l’image"
          title="Agrandir l’image"
        >
          <img
            class="reference-image"
            [src]="image.imageUrl"
            [alt]="image.description"
            draggable="false"
          />
        </button>

        <button
          type="button"
          class="icon-button expand-button"
          (click)="openImageOverlay()"
          aria-label="Afficher l’image en plein écran"
          title="Agrandir"
        >
          <svg lucideMaximize2 [size]="18" aria-hidden="true"></svg>
        </button>

        @if (imageLoading()) {
          <div class="image-status">
            <span class="spinner" aria-hidden="true"></span>

            <span>Chargement de l’image…</span>
          </div>
        }

        @if (imageError()) {
          <div class="image-status image-status-error">
            <p>Cette image n’a pas pu être chargée.</p>

            <div class="image-error-actions">
              <button type="button" (click)="retryCurrentImage()">Réessayer</button>

              @if (store.hasNext()) {
                <button type="button" (click)="skipCurrentImage()">Image suivante</button>
              }
            </div>
          </div>
        }
      </div>

      <figcaption>
        <span class="image-credit">
          @if (image.authorName) {
            <span>Image par </span>

            @if (image.authorUrl) {
              <a [href]="image.authorUrl" target="_blank" rel="noopener noreferrer">
                {{ image.authorName }}
              </a>
            } @else {
              <span>{{ image.authorName }}</span>
            }

            <span> sur </span>
          } @else {
            <span>Image provenant de </span>
          }

          <a [href]="image.originalUrl" target="_blank" rel="noopener noreferrer">
            {{ image.sourceName }}
          </a>
        </span>

        <span class="image-counter">
          {{ displayedIndex() + 1 }} /
          {{ store.images().length }}
        </span>
      </figcaption>
    </figure>
  } @else if (imageLoading()) {
    <div class="state">
      <span class="spinner" aria-hidden="true"></span>

      <p>Chargement de l’image…</p>
    </div>
  } @else if (imageError()) {
    <div class="state state-error">
      <p>Cette image n’a pas pu être chargée.</p>

      <button type="button" class="state-action" (click)="retryCurrentImage()">Réessayer</button>
    </div>
  }
</main>

@if (imageExpanded() && displayedImage(); as image) {
  <app-session-overlay
    [image]="image"
    [nextImage]="nextImage()"
    [currentIndex]="displayedIndex()"
    [totalImages]="store.images().length"
    [(durationMinutes)]="durationMinutes"
    [running]="timerRunning()"
    [formattedTime]="formattedTime()"
    [progress]="timerProgress()"
    (closeRequested)="closeImageOverlay()"
    (nextRequested)="next()"
    (toggleTimerRequested)="toggleTimer()"
    (resetTimerRequested)="resetTimer()"
  />
}

<app-session-controls
  [previewImages]="previewImages()"
  [totalImages]="store.images().length"
  [nextImage]="nextImage()"
  [hasPrevious]="store.hasPrevious()"
  [hasNext]="store.hasNext()"
  [(durationMinutes)]="durationMinutes"
  [running]="timerRunning()"
  [disabled]="!displayedImage()"
  [formattedTime]="formattedTime()"
  [progress]="timerProgress()"
  (previousRequested)="previous()"
  (nextRequested)="next()"
  (toggleTimerRequested)="toggleTimer()"
  (resetTimerRequested)="resetTimer()"
/>
