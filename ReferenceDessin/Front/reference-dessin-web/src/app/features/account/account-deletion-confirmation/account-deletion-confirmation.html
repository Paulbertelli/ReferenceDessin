<div class="dialog-backdrop" (click)="cancelDeletion()">
  <section
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="deletion-title"
    aria-describedby="deletion-description"
    (click)="$event.stopPropagation()"
  >
    <h2 id="deletion-title">Supprimer votre compte ?</h2>

    <p id="deletion-description">
      Cette action supprimera définitivement votre compte et les données qui lui sont associées.
      Elle ne pourra pas être annulée.
    </p>

    <div class="actions">
      <button type="button" class="button secondary-button" autofocus (click)="cancelDeletion()">
        Annuler
      </button>

      <button type="button" class="button danger-button" (click)="confirmDeletion()">
        Supprimer définitivement
      </button>
    </div>
  </section>
</div>
