<main class="not-found-page">
  <div class="not-found-page__content">
    <span class="not-found-page__code" aria-hidden="true">404</span>

    <h1>Cette page n’existe pas</h1>

    <p>L’adresse est incorrecte ou la page a été déplacée.</p>

    <div class="not-found-page__actions">
      <a class="primary-action" routerLink="/">
        <svg lucideHome [size]="18" aria-hidden="true"></svg>

        Retour à l’accueil
      </a>

      <a class="secondary-action" routerLink="/search">
        <svg lucideSearch [size]="18" aria-hidden="true"></svg>

        Rechercher des références
      </a>
    </div>
  </div>
</main>
