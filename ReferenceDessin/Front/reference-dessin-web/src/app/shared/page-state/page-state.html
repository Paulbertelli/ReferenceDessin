<section
  class="page-state"
  [class.page-state--loading]="type() === 'loading'"
  [class.page-state--error]="type() === 'error'"
  [class.page-state--empty]="type() === 'empty'"
  [attr.role]="role()"
  [attr.aria-live]="ariaLive()"
>
  @if (type() === 'loading') {
    <span class="page-state__spinner" aria-hidden="true"></span>
  }

  @if (title()) {
    <h2>{{ title() }}</h2>
  }

  <p>{{ message() }}</p>

  @if (actionLabel()) {
    <button type="button" class="app-button app-button--secondary" (click)="actionRequested.emit()">
      {{ actionLabel() }}
    </button>
  }
</section>
