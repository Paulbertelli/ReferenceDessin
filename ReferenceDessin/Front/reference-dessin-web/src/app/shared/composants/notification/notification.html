@if (notificationService.notification(); as notification) {
  <aside
    class="notification"
    [class.notification--erreur]="notification.type === 'erreur'"
    [class.notification--succes]="notification.type === 'succes'"
    [class.notification--information]=" notification.type === 'information'"

    [attr.role]="notification.type === 'erreur' ? 'alert' : 'status'"

    [attr.aria-live]="notification.type === 'erreur' ? 'assertive' : 'polite'">

    <span
      class="notification__indicateur"
      aria-hidden="true">
    </span>

    <p class="notification__message">
      {{ notification.message }}
    </p>

    <button
      type="button"
      class="notification__fermeture"
      (click)="effacer()"
      aria-label="Fermer la notification"
      title="Fermer">
      ×
    </button>
  </aside>
}
