name: referencedessin-prod-test

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: reference_dessin
      POSTGRES_USER: reference_dessin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Mot de passe PostgreSQL requis}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U reference_dessin -d reference_dessin
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - database

  init-keys:
    image: reference-dessin:local
    user: "0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "chown -R 1654:1654 /keys && chmod 700 /keys"
    volumes:
      - data-protection:/keys

  migrations:
    image: reference-dessin-migrations:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migrations

    restart: "no"

    environment:
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=reference_dessin;Username=reference_dessin;Password=${POSTGRES_PASSWORD:?Mot de passe requis}"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - database

  reference-dessin-app:
    image: reference-dessin:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: execution

    restart: unless-stopped

    env_file:
      - ../../.env.docker.local

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ApplicationCliente__Url: https://localhost:8443
      ReverseProxy__KnownProxy: 172.30.250.10
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=reference_dessin;Username=reference_dessin;Password=${POSTGRES_PASSWORD:?Mot de passe requis}"

    volumes:
      - data-protection:/home/app/.aspnet/DataProtection-Keys

    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      init-keys:
        condition: service_completed_successfully

    networks:
      - database
      - proxy

  caddy:
    image: caddy:2
    restart: unless-stopped

    ports:
      - "127.0.0.1:8443:443"

    volumes:
      - ./Caddyfile.prod-test:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

    depends_on:
      - reference-dessin-app

    networks:
      proxy:
        ipv4_address: 172.30.250.10

volumes:
  postgres-data:
  data-protection:
  caddy-data:
  caddy-config:

networks:
  database:
    internal: true

  proxy:
    ipam:
      config:
        - subnet: 172.30.250.0/24
