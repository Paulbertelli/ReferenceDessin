<header class="header">
  <h1>Référence Dessin</h1>

  <form class="search" (ngSubmit)="search()">

    <input
      id="search-query"
      name="search-query"
      type="search"
      [(ngModel)]="searchQuery"
      placeholder="Portrait, animal, architecture…"
    >

    <button type="submit" [disabled]="loading()">
      Rechercher
    </button>
  </form>
</header>

<main class="workspace">
  @if (loading()) {
    <p class="message">Chargement des références...</p>
  } @else if (error()) {
    <p class="message error">{{ error() }}</p>
  } @else if (currentPhoto(); as photo) {
    <figure
      class="reference"
      [style.--average-color]="photo.averageColor"
    >
      <img
        [src]="photo.imageUrl"
        [alt]="photo.description"
      >

      <figcaption>
        Photo par
        <a
          [href]="photo.photographerUrl"
          target="_blank"
          rel="noopener noreferrer"
        >
          {{ photo.photographer }}
        </a>
        sur
        <a
          [href]="photo.pexelsUrl"
          target="_blank"
          rel="noopener noreferrer"
        >
          Pexels
        </a>
      </figcaption>
    </figure>
  }
</main>

<footer class="controls">
  <button
    type="button"
    (click)="previous()"
    [disabled]="currentIndex() === 0"
  >
    ← Précédente
  </button>

  <span>
    {{ photos().length ? currentIndex() + 1 : 0 }}
    /
    {{ photos().length }}
  </span>

  <button
    type="button"
    (click)="next()"
    [disabled]="currentIndex() >= photos().length - 1"
  >
    Suivante →
  </button>
</footer>
