<header class="header">
  <a class="brand" href="/" aria-label="Référence Dessin — Accueil">
    <img class="brand-logo" src="/logo.png" alt="">
    <span>Référence Dessin</span>
  </a>

  <form class="search" (ngSubmit)="search()">
    <label class="sr-only" for="search-query">
      Rechercher un thème
    </label>

    <input
      id="search-query"
      name="search-query"
      type="search"
      [(ngModel)]="searchQuery"
      placeholder="Portrait, animal, architecture…"
      autocomplete="off"
    >

    <button
      type="submit"
      class="icon-button search-button"
      [disabled]="loading()"
      aria-label="Rechercher"
      title="Rechercher"
    >
      <svg
        lucideSearch
        [size]="20"
        aria-hidden="true"
      ></svg>
    </button>
  </form>
</header>

<main
  class="workspace"
  [attr.aria-busy]="loading()"
  aria-live="polite"
>
  @if (loading()) {
    <div class="state">
      <span class="spinner" aria-hidden="true"></span>
      <p>Chargement des références…</p>
    </div>
  } @else if (error()) {
    <div class="state state-error">
      <p>{{ error() }}</p>
    </div>
  } @else if (currentPhoto(); as photo) {
    <figure class="reference">
      <div class="image-container">
        <button
          type="button"
          class="image-button"
          (click)="openImageOverlay()"
          aria-label="Agrandir l’image"
          title="Agrandir l’image"
        >
          <img
            class="reference-image"
            [src]="photo.imageUrl"
            [alt]="photo.description"
            draggable="false"
          >
        </button>

        <button
          type="button"
          class="icon-button expand-button"
          (click)="openImageOverlay()"
          aria-label="Afficher l’image en plein écran"
          title="Agrandir"
        >
          <svg
            lucideMaximize2
            [size]="18"
            aria-hidden="true"
          ></svg>
        </button>
      </div>

      <figcaption>
        <span class="photo-credit">
          Photo par
          <a
            [href]="photo.photographerUrl"
            target="_blank"
            rel="noopener noreferrer"
          >
            {{ photo.photographer }}
          </a>
          sur
          <a
            [href]="photo.pexelsUrl"
            target="_blank"
            rel="noopener noreferrer"
          >
            Pexels
          </a>
        </span>

        <span class="photo-counter">
          {{ currentIndex() + 1 }} / {{ photos().length }}
        </span>
      </figcaption>
    </figure>
  }
</main>

@if (imageExpanded() && currentPhoto(); as photo) {
  <div
    class="image-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="Image agrandie"
    (click)="closeImageOverlay()"
  >
    <button
      type="button"
      class="icon-button overlay-close"
      (click)="closeImageOverlay()"
      aria-label="Fermer l’image agrandie"
      title="Fermer"
    >
      <svg
        lucideX
        [size]="24"
        aria-hidden="true"
      ></svg>
    </button>

    <div class="overlay-content">
      <img
        [src]="photo.imageUrl"
        [alt]="photo.description"
        draggable="false"
        (click)="$event.stopPropagation()"
      >
    </div>
  </div>
}

<footer class="controls">
  <button
    type="button"
    class="icon-button previous-button"
    (click)="previous()"
    [disabled]="currentIndex() === 0"
    aria-label="Image précédente"
    title="Image précédente"
  >
    <svg
      lucideChevronLeft
      [size]="22"
      aria-hidden="true"
    ></svg>
  </button>

  <div class="timer">
    <div
      class="timer-progress"
      [style.width.%]="timerProgress()"
      aria-hidden="true"
    ></div>

    <button
      type="button"
      class="icon-button timer-action"
      (click)="toggleTimer()"
      [disabled]="!currentPhoto()"
      [attr.aria-label]="
        timerRunning()
          ? 'Mettre le minuteur en pause'
          : 'Démarrer le minuteur'
      "
      [title]="timerRunning() ? 'Mettre en pause' : 'Démarrer'"
    >
      @if (timerRunning()) {
        <svg
          lucidePause
          [size]="19"
          aria-hidden="true"
        ></svg>
      } @else {
        <svg
          lucidePlay
          [size]="19"
          aria-hidden="true"
        ></svg>
      }
    </button>

    <output class="timer-value" aria-label="Temps restant">
      {{ formattedTime() }}
    </output>

    <label class="duration">
      <span>Durée</span>

      <span class="duration-input">
        <input
          type="number"
          min="0.1"
          max="60"
          step="0.5"
          [(ngModel)]="durationMinutes"
          (change)="resetTimer()"
          aria-label="Durée en minutes"
        >
        <span>min</span>
      </span>
    </label>

    <button
      type="button"
      class="icon-button reset-button"
      (click)="resetTimer()"
      aria-label="Réinitialiser le minuteur"
      title="Réinitialiser"
    >
      <svg
        lucideRotateCcw
        [size]="18"
        aria-hidden="true"
      ></svg>
    </button>
  </div>

  <button
    type="button"
    class="icon-button next-button"
    (click)="next()"
    [disabled]="currentIndex() >= photos().length - 1"
    aria-label="Image suivante"
    title="Image suivante"
  >
    <svg
      lucideChevronRight
      [size]="22"
      aria-hidden="true"
    ></svg>
  </button>
</footer>
